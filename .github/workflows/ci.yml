name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.x"]  # minimum supporté et dernière stable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y lilypond qpdf
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m solfege check
      - run: pytest  # LilyPond et qpdf installés : les tests "rendu" tournent aussi
      - run: python -m solfege  # cahier.txt complet : code 2 si une leçon déborde
