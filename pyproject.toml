[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solfege"
version = "0.3.0"
description = "Cahier de lecture rythmique pour enfant : cahier.txt -> LilyPond -> PDF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # bibliothèque standard seulement ; outils externes : LilyPond, qpdf ; pdftoppm pour vérifier

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[project.scripts]
solfege = "solfege.cli:main"

[tool.setuptools]
packages = ["solfege"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["rendu: nécessite LilyPond et qpdf (ignoré s'ils sont absents)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # guillemets « » et apostrophes françaises voulus

[tool.ruff.lint.per-file-ignores]
"solfege/lilypond.py" = ["E501"]  # gabarit LilyPond : lignes longues voulues (sortie identique)
"solfege/largeurs.py" = ["E501"]  # tables de largeurs de glyphes, une police par ligne
